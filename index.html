<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>真我回响</title>
    <meta
      name="description"
      content="真我回响 — 从素材出发，重放一个人的说话方式。"
    />
  </head>
  <body data-theme="garden">
    <script>
      // 首屏前应用已保存的主题，避免闪一下默认色域。
      // 必须内联 —— 放到模块里执行太晚（模块是 defer 的）。
      try {
        var t = localStorage.getItem('tse.theme')
        if (t && ['dawn', 'tide', 'dusk', 'garden'].indexOf(t) >= 0) {
          document.body.dataset.theme = t
        }
      } catch (e) {
        /* 隐私模式忽略 */
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
